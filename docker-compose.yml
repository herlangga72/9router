services:
  9router:
    # Default image: smallest footprint, no Python bundled.
    build:
      context: .
      target: runner
    image: ${NINE_ROUTER_IMAGE:-herlangga72/9router:latest}
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production

  # Optional Headroom sidecar (external Python proxy).
  #   docker compose --profile sidecar up -d
  # then set HEADROOM_URL=http://headroom:8787 (uncomment below).
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"
    profiles: ["sidecar"]

volumes:
  9router-data:
    name: 9router-data
